name: GPTWake Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for pkg in "platforms;android-37.0" "build-tools;37.0.0"; do
            sdkmanager "$pkg" || sdkmanager --channel=3 "$pkg"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Audit final APK manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest-audit.txt

          if grep -Fq "VoiceNotificationListener" manifest-audit.txt; then
            echo "FAIL: notification listener still present"
            exit 1
          fi

          if grep -Fq "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" manifest-audit.txt; then
            echo "FAIL: notification listener binding still present"
            exit 1
          fi

          grep -Fq "WakeService" manifest-audit.txt
          grep -Fq "android.permission.RECORD_AUDIO" manifest-audit.txt

          echo "PASS: notification listener removed"
          echo "PASS: wake service and microphone permission present"

      - name: Save test APK and audit report
        uses: actions/upload-artifact@v7
        with:
          name: GPTWake-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            manifest-audit.txt
          if-no-files-found: error
          retention-days: 7

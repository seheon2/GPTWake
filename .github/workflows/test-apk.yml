name: GPTWake Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for pkg in "platforms;android-37.0" "build-tools;37.0.0"; do
            sdkmanager "$pkg" || sdkmanager --channel=3 "$pkg"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Save test APK
        uses: actions/upload-artifact@v7
        with:
          name: GPTWake-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
